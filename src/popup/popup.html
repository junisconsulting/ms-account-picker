<!doctype html>
<!--
  Shell only. The entire UI lives in ../ui/config-ui.js and is shared with the
  other surface — without a bundler an HTML shell cannot be shared, and fetching
  a fragment would need `fetch` (forbidden) plus web_accessible_resources.
  Nothing but boilerplate belongs in here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MS Account Picker</title>
    <link rel="stylesheet" href="../ui/config-ui.css">
    <!-- A module script is deferred, so document.body exists when it runs.
         Keeping it out of <body> lets the UI own the body element outright. -->
    <script type="module" src="popup.js"></script>
  </head>
  <body></body>
</html>
