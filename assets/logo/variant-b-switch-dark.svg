<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MS Account Picker — Variant B, dark ground: navy swapped for light ink</title>
  <!-- One sign-in comes in, two accounts are possible, the yellow branch is the
       one taken. Closest to the junis arc language without copying the mark.
       Two details that only matter at 16 px: the strokes are heavy and the mark
       sits centred with equal margins, because a thin, tall version of the same
       idea disappears in the toolbar. Paint order is deliberate — the stem goes
       on last, so the yellow branch reads as coming out from behind it instead
       of crossing over it. -->
  <!-- scale: fills the icon box to ~8% margin. A toolbar icon that keeps a
       12% margin looks a size too small next to Chrome's own icons. -->
  <g transform="translate(256 256) scale(1.13) translate(-256 -256)">
  <path d="M256 292 C256 214 332 158 404 136" fill="none" stroke="#fcd218"
        stroke-width="88" stroke-linecap="round"/>
  <path d="M256 292 C256 214 180 158 108 136" fill="none" stroke="#e9edf4"
        stroke-width="88" stroke-linecap="round"/>
  <path d="M256 376 L256 288" fill="none" stroke="#e9edf4"
        stroke-width="88" stroke-linecap="round"/>
  </g>
</svg>
