<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <title>The MS Account Picker popup open under its toolbar icon: switched on for this profile, direct sign-in as the default for every Microsoft sign-in, the account picker for portal.azure.com and the browser default for security.microsoft.com.</title>
  <!-- An illustration, not a screenshot: account names are Microsoft's fictional ones.
       Layout and labels follow src/popup/popup.html, src/ui/config-ui.js and the light
       tokens of src/ui/config-ui.css; keep them in step when the popup changes.
       The version pill is left out so the picture never goes stale, and the GitHub link so it
       carries no third-party mark. Space forced one cut:
       the hint under "Exceptions for specific sites" shows its first sentence only.
       The footer's rule count is buildRules() for this state: OIDC and SAML base rules, a
       guard pair plus an injection pair for portal.azure.com, a guard pair for
       security.microsoft.com (Defender; a SharePoint host would never match, open-questions F12),
       and the hint-yield rule. Recompute it with node whenever
       src/lib/rules.js changes. -->
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
    .co-h { font-size: 15px; font-weight: 600; fill: #0F172A; }
    .co-t { font-size: 12.5px; fill: #64748B; }
    .lead { fill: none; stroke: #D9B200; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .pin { fill: #fcd218; stroke: #061838; stroke-width: 1.5; }
    .cap { font-size: 10.5px; font-weight: 600; fill: #5b6675; letter-spacing: .7px; }
    .opt { font-size: 12.5px; font-weight: 600; fill: #0d1526; }
    .sub { font-size: 11px; fill: #5b6675; }
    .ctl { font-size: 12px; fill: #0d1526; }
    .card { fill: #f5f7fa; stroke: #dfe4ec; }
    .field { fill: #ffffff; stroke: #dfe4ec; }
    .ico { fill: none; stroke: #475569; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <clipPath id="canvas"><rect x="0.5" y="0.5" width="959" height="719" rx="16"/></clipPath>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
    <!-- The mark from assets/logo/mark.svg, unchanged -->
    <g id="mark">
      <g transform="translate(256 256) scale(1.13) translate(-256 -256)">
        <path d="M256 292 C256 214 332 158 404 136" fill="none" stroke="#fcd218" stroke-width="88" stroke-linecap="round"/>
        <path d="M256 292 C256 214 180 158 108 136" fill="none" stroke="#061838" stroke-width="88" stroke-linecap="round"/>
        <path d="M256 376 L256 288" fill="none" stroke="#061838" stroke-width="88" stroke-linecap="round"/>
      </g>
    </g>
    <path id="chev" d="M-3.5 -1.8 L0 1.8 L3.5 -1.8" fill="none" stroke="#0d1526" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="radio-off"><circle r="6" fill="#ffffff" stroke="#767676"/></g>
    <g id="radio-on"><circle r="5.6" fill="#ffffff" stroke="#061838" stroke-width="1.6"/><circle r="3" fill="#061838"/></g>
  </defs>

  <g clip-path="url(#canvas)">
    <rect x="0" y="0" width="960" height="720" fill="#F8FAFC"/>

    <!-- Browser toolbar: tab strip -->
    <rect x="0" y="0" width="960" height="34" fill="#EEF1F6"/>
    <path d="M10 34 Q16 34 16 28 V14 Q16 6 24 6 H228 Q236 6 236 14 V28 Q236 34 242 34 Z" fill="#FFFFFF"/>
    <rect x="30" y="13" width="14" height="14" rx="4" fill="#CBD5E1"/>
    <text x="52" y="24.5" font-size="12" fill="#334155">portal.azure.com</text>
    <path class="ico" d="M216 16.5 l7 7 M223 16.5 l-7 7" stroke-width="1.4"/>
    <path class="ico" d="M258 15 v10 M253 20 h10"/>
    <g class="ico" stroke-width="1.3">
      <path d="M842 17.5 h10"/>
      <rect x="878" y="12.5" width="10" height="10" rx="1.5"/>
      <path d="M914 12.5 l10 10 M924 12.5 l-10 10"/>
    </g>

    <!-- Browser toolbar: address row -->
    <rect x="0" y="34" width="960" height="38" fill="#FFFFFF"/>
    <path d="M0 72.5 H960" stroke="#E2E8F0"/>
    <path class="ico" d="M34 53 h-12 M27 47.5 l-5.5 5.5 l5.5 5.5"/>
    <path class="ico" d="M52 53 h12 M59 47.5 l5.5 5.5 l-5.5 5.5" stroke="#CBD5E1"/>
    <path class="ico" d="M100 53 a6.5 6.5 0 1 1 -1.9 -4.6 M98.6 45 v3.6 h-3.6"/>
    <rect x="116" y="40" width="748" height="26" rx="13" fill="#F1F5F9"/>
    <g class="ico" stroke-width="1.4">
      <rect x="131" y="51.5" width="9" height="7" rx="1.5"/>
      <path d="M133 51.5 v-2 a2.5 2.5 0 0 1 5 0 v2"/>
    </g>
    <text x="150" y="57.5" font-size="13" fill="#0F172A">portal.azure.com</text>
    <rect x="894" y="39" width="28" height="28" rx="7" fill="#E5EAF1"/>
    <use href="#mark" transform="translate(899 44) scale(0.03516)"/>
    <g fill="#475569"><circle cx="938" cy="53" r="1.6"/><circle cx="944" cy="53" r="1.6"/><circle cx="950" cy="53" r="1.6"/></g>

    <!-- Popup -->
    <rect x="508" y="80" width="420" height="621" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#lift)"/>

    <!-- Header -->
    <use href="#mark" transform="translate(518 89) scale(0.05469)"/>
    <text x="556" y="109" font-size="14" font-weight="600" fill="#0d1526">MS Account Picker</text>

    <!-- Active in this profile -->
    <rect x="519" y="124" width="398" height="47" rx="8" class="card"/>
    <rect x="531" y="135" width="13" height="13" rx="2.5" fill="#061838"/>
    <path d="M534 141.6 l2.6 2.6 l4.6 -5.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="147" class="opt">Active in this profile</text>
    <text x="553" y="162" class="sub">Leave this off in your everyday profile.</text>

    <!-- When you sign in to Microsoft -->
    <rect x="519" y="178" width="398" height="223" rx="8" class="card"/>
    <text x="531" y="196" class="cap">WHEN YOU SIGN IN TO MICROSOFT</text>
    <use href="#radio-off" x="537.5" y="211"/>
    <text x="553" y="215" class="opt">Account picker</text>
    <text x="553" y="229" class="sub">Always show the account chooser. Sends no identity.</text>
    <use href="#radio-on" x="537.5" y="244"/>
    <text x="553" y="248" class="opt">Direct sign-in</text>
    <text x="553" y="262" class="sub">Straight to one account while its sign-in session lasts;</text>
    <text x="553" y="276" class="sub">once it expires, the picker appears again. No other</text>
    <text x="553" y="290" class="sub">account stays reachable.</text>
    <use href="#radio-off" x="537.5" y="305"/>
    <text x="553" y="309" class="opt">Only the sites I list</text>
    <text x="553" y="323" class="sub">Every other Microsoft sign-in is left alone.</text>
    <text x="531" y="343" font-size="11.5" font-weight="600" fill="#0d1526">Account for direct sign-in</text>
    <rect x="531" y="349" width="374" height="28" rx="6" class="field"/>
    <text x="540" y="367.5" font-size="12.5" fill="#0d1526">adele.admin@contoso.onmicrosoft.com</text>
    <text x="531" y="391" class="sub">In the sign-in URL, so also in history and proxy logs.</text>

    <!-- Exceptions for specific sites (expanded) -->
    <rect x="519" y="408" width="398" height="197" rx="8" class="card"/>
    <path d="M531 419.5 h7 l-3.5 4.5 z" fill="#5b6675"/>
    <text x="543" y="426" class="cap">EXCEPTIONS FOR SPECIFIC SITES (2)</text>
    <text x="531" y="443" class="sub">A site you use with more than one account usually wants the</text>
    <text x="531" y="457" class="sub">picker, even where direct sign-in is set.</text>

    <rect x="531" y="465" width="374" height="28" rx="6" class="field"/>
    <text x="540" y="483" font-size="11.5" font-weight="500" fill="#0d1526" class="mono">portal.azure.com</text>
    <rect x="748" y="468" width="120" height="22" rx="6" class="field"/>
    <text x="755" y="483" class="ctl">Account picker</text>
    <use href="#chev" x="856" y="479"/>
    <rect x="876" y="467" width="24" height="24" rx="6" class="field"/>
    <path d="M884.5 475.5 l7 7 M891.5 475.5 l-7 7" fill="none" stroke="#5b6675" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="531" y="499" width="374" height="28" rx="6" class="field"/>
    <text x="540" y="517" font-size="11.5" font-weight="500" fill="#0d1526" class="mono">security.microsoft.com</text>
    <rect x="748" y="502" width="120" height="22" rx="6" class="field"/>
    <text x="755" y="517" class="ctl">Browser default</text>
    <use href="#chev" x="856" y="513"/>
    <rect x="876" y="501" width="24" height="24" rx="6" class="field"/>
    <path d="M884.5 509.5 l7 7 M891.5 509.5 l-7 7" fill="none" stroke="#5b6675" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="531" y="533" width="374" height="28" rx="6" class="field"/>
    <text x="540" y="551.5" font-size="12.5" fill="#757575">make.powerautomate.com</text>
    <rect x="531" y="567" width="318" height="28" rx="6" class="field"/>
    <text x="540" y="585.5" font-size="12.5" fill="#0d1526">Account picker</text>
    <use href="#chev" x="836" y="581"/>
    <rect x="855" y="567" width="50" height="28" rx="6" fill="#061838"/>
    <text x="880" y="585.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Add</text>

    <!-- Already signed in to a site? (collapsed) -->
    <rect x="519" y="612" width="398" height="30" rx="8" class="card"/>
    <path d="M532 623.5 v7 l4.5 -3.5 z" fill="#5b6675"/>
    <text x="543" y="631" class="cap">ALREADY SIGNED IN TO A SITE?</text>

    <!-- Status and footer -->
    <text x="519" y="661" font-size="11.5" font-weight="600" fill="#5b6675">Saved. Default: direct sign-in, 2 exceptions.</text>
    <path d="M519 670.5 H917" stroke="#dfe4ec"/>
    <text x="519" y="687" font-size="11" fill="#5b6675">9 rules active</text>
    <text x="917" y="687" font-size="11" font-weight="600" fill="#5b6675" text-anchor="end">junis GmbH</text>

    <!-- Callouts -->
    <text x="40" y="125" class="co-h">Off until you switch it on</text>
    <text x="40" y="146" class="co-t">Each profile decides for itself. Where it is off,</text>
    <text x="40" y="163" class="co-t">sign-in stays as it was.</text>
    <path class="lead" d="M404 141 H520"/>
    <circle class="pin" cx="520" cy="141" r="4"/>

    <text x="40" y="234" class="co-h">One choice for every Microsoft sign-in</text>
    <text x="40" y="255" class="co-t">The account chooser by default, straight to one</text>
    <text x="40" y="272" class="co-t">account, or only the sites you list.</text>
    <path class="lead" d="M404 250 H520"/>
    <circle class="pin" cx="520" cy="250" r="4"/>

    <text x="40" y="347" class="co-h">Only direct sign-in names an account</text>
    <text x="40" y="368" class="co-t">The picker sends no identity; direct sign-in puts</text>
    <text x="40" y="385" class="co-t">the account into the URL.</text>
    <path class="lead" d="M404 363 H520"/>
    <circle class="pin" cx="520" cy="363" r="4"/>

    <text x="40" y="480" class="co-h">Exceptions per site</text>
    <text x="40" y="501" class="co-t">Straight to the admin account everywhere,</text>
    <text x="40" y="518" class="co-t">the chooser on portal.azure.com, Defender left alone.</text>
    <path class="lead" d="M404 496 H520"/>
    <circle class="pin" cx="520" cy="496" r="4"/>

    <text x="40" y="611" class="co-h">Already signed in?</text>
    <text x="40" y="632" class="co-t">A site you are already signed in to does not ask again.</text>
    <text x="40" y="649" class="co-t">Signing out of Microsoft hands it back to your setting.</text>
    <path class="lead" d="M404 627 H520"/>
    <circle class="pin" cx="520" cy="627" r="4"/>
  </g>
  <rect x="0.5" y="0.5" width="959" height="719" rx="16" fill="none" stroke="#E2E8F0"/>
</svg>
